<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="alternate icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Academia Artemis: academia 100% online con contenido para ESO, Bachillerato y Universidad. Planes mensuales sin permanencia.">
    <title>Academia Artemis · Academia online de ESO, Bachillerato y Universidad</title>
    <script>
      // Fija el tema antes de pintar nada para evitar el parpadeo:
      // preferencia guardada > tema del sistema operativo
      ;(function () {
        var tema = localStorage.getItem('tema')
        if (!tema) {
          tema = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = tema
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
